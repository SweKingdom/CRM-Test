name: Check

# The same gate as `scripts/check` on a developer machine. Read-only: it only reports pass or fail, and it needs no credentials.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REQUIRE_ALL: "1"
    services:
      postgres:
        image: postgres:16
        # Same values as .env.example (dev-only placeholders, a throw-away database).
        env:
          POSTGRES_DB: zephyr
          POSTGRES_USER: zephyr
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zephyr -d zephyr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create .env from .env.example
        run: cp .env.example .env
      - name: Quality gate
        run: bash scripts/check
