name: zephyr

# Plain Compose: works with Docker, Podman compose and Rancher Desktop.
# All published ports are bound to 127.0.0.1. Settings come from .env.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [zephyr]

  api:
    build:
      context: ./src/backend/Zephyr.Api
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          read -r line <&3
          [[ "$$line" == *" 200 "* ]]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [zephyr]

  web:
    build:
      context: ./src/frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [zephyr]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      # Rendered from infra/keycloak/*.template.json by scripts/setup-env.mjs (gitignored).
      - ./infra/keycloak/generated:/opt/keycloak/data/import:ro
    healthcheck:
      # Health endpoints are served on the management port 9000 (not published).
      test:
        - CMD-SHELL
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          read -r line <&3
          [[ "$$line" == *" 200 "* ]]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks: [zephyr]

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [zephyr]

volumes:
  pgdata:

networks:
  zephyr:
